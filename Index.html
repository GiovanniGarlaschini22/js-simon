<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Giovanni Garlaschini">
    <title>Simon Says</title>
</head>

<body>
    <form id="id-form">
        <label for="user-id">ID Utente:</label>
        <input type="text" id="user-id" value="ID0000" readonly>
    </form>

    <div id="numeri-container">
        <p id="numeri"></p>
    </div>

    <div id="timer">30</div>

    <div id="input-container" style="display: none;">
        <label for="num1">Numero 1:</label>
        <input type="number" id="num1">
        <label for="num2">Numero 2:</label>
        <input type="number" id="num2">
        <label for="num3">Numero 3:</label>
        <input type="number" id="num3">
        <label for="num4">Numero 4:</label>
        <input type="number" id="num4">
        <label for="num5">Numero 5:</label>
        <input type="number" id="num5">
        <button id="conferma">Conferma</button>
    </div>

    <p id="risultato"></p>
    <script src="script.js"></script>
    <script src="./JS/script.js"></script>
</body>

</html>
