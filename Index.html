<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Giovanni Garlaschini">
    <title>Simon Says</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>

<body class="bg-light">
    <div class="container my-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title text-center">Simon Says</h5>

                <div id="alert-container" class="mb-3" style="display: none;">
                    <div class="alert alert-danger" role="alert" id="alert-message">
                      I valori inseriti non sono numeri! Inserire valori numerici.
                    </div>
                </div>

                <form id="id-form" class="mb-3">
                    <div class="mb-3">
                        <label for="user-id" class="form-label">ID Utente</label>
                        <input type="text" id="user-id" class="form-control" value="ID0000" readonly>
                    </div>
                </form>

                <div id="numeri-container" class="mb-3">
                    <p id="numeri" class="text-center fs-5"></p>
                </div>

                <div id="timer" class="text-center fs-4 text-primary mb-3">30</div>

                <div id="input-container" class="mb-3" style="display: none;">
                    <div class="row g-2">
                        <div class="col">
                            <label for="num1" class="form-label">Numero 1</label>
                            <input type="number" id="num1" class="form-control">
                        </div>
                        <div class="col">
                            <label for="num2" class="form-label">Numero 2</label>
                            <input type="number" id="num2" class="form-control">
                        </div>
                        <div class="col">
                            <label for="num3" class="form-label">Numero 3</label>
                            <input type="number" id="num3" class="form-control">
                        </div>
                        <div class="col">
                            <label for="num4" class="form-label">Numero 4</label>
                            <input type="number" id="num4" class="form-control">
                        </div>
                        <div class="col">
                            <label for="num5" class="form-label">Numero 5</label>
                            <input type="number" id="num5" class="form-control">
                        </div>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button id="conferma" class="btn btn-primary" style="display: none;">Conferma</button>
                </div>

                <p id="risultato-tutti" class="mt-2 badge shadow p-3 mb-5 rounded-pill text-bg-success p-2 position-absolute top-100 start-50 translate-middle"></p>
                <p id="risultato-alcuni" class="mt-2 badge shadow p-3 mb-5 rounded-pill text-bg-info p-2 position-absolute top-100 start-50 translate-middle"></p>
                <p id="risultato-nessuno" class="mt-2 badge shadow p-3 mb-5 rounded-pill text-bg-danger p-2 position-absolute top-100 start-50 translate-middle"></p>
            </div>
        </div>
    </div>

    <p id="risultato"></p>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
    <script src="./JS/script.js"></script>
</body>

</html>
